services:
  oracle-db:
    image: container-registry.oracle.com/database/express:latest
    container_name: oracle-ex
    healthcheck:
      test: [ "CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -S system/Oracle123@XEPDB1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    ports:
      - "1521:1521"
      - "5500:5500"
    env_file:
      - .env
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
  cache:
    driver: local